<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fafafa"/>
      <stop offset="100%" style="stop-color:#f4f4f5"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#000080"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Grid Pattern -->
  <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
    <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#94a3b8" stroke-width="0.5" opacity="0.1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Decorative Pills -->
  <rect x="900" y="-100" width="60" height="400" rx="30" fill="#000080" opacity="0.05" transform="rotate(45 900 -100)"/>
  <rect x="1000" y="100" width="40" height="300" rx="20" fill="#06b6d4" opacity="0.08" transform="rotate(45 1000 100)"/>
  <rect x="100" y="400" width="50" height="350" rx="25" fill="#000080" opacity="0.05" transform="rotate(45 100 400)"/>

  <!-- Logo Box -->
  <rect x="80" y="80" width="80" height="80" fill="#101010"/>
  <text x="120" y="135" font-family="monospace" font-size="28" font-weight="bold" fill="white" text-anchor="middle">LS</text>

  <!-- Brand Name -->
  <text x="180" y="115" font-family="Inter, sans-serif" font-size="24" font-weight="bold" fill="#101010">LUKERI STUDIO</text>
  <text x="180" y="145" font-family="monospace" font-size="12" fill="#000080" letter-spacing="2">DESIGN &amp; TECH</text>

  <!-- Main Headline -->
  <text x="80" y="280" font-family="Inter, sans-serif" font-size="72" font-weight="bold" fill="#101010">DİJİTAL</text>
  <text x="80" y="360" font-family="Inter, sans-serif" font-size="72" font-weight="bold" fill="#000080">GELECEĞİ</text>
  <text x="80" y="440" font-family="Inter, sans-serif" font-size="72" font-weight="bold" fill="#101010">OLUŞTURUYORUZ.</text>

  <!-- Tagline -->
  <text x="80" y="520" font-family="Inter, sans-serif" font-size="20" fill="#475569">Flutter • Mobil Geliştirme • Premium UI/UX • IoT Çözümleri</text>

  <!-- Bottom Accent Line -->
  <rect x="80" y="560" width="200" height="4" fill="url(#accentGradient)"/>

  <!-- Stats -->
  <text x="900" y="480" font-family="Inter, sans-serif" font-size="48" font-weight="bold" fill="#000080">24+</text>
  <text x="900" y="510" font-family="monospace" font-size="12" fill="#475569" letter-spacing="1">GLOBAL TESLİMAT</text>

  <text x="1020" y="480" font-family="Inter, sans-serif" font-size="48" font-weight="bold" fill="#000080">05+</text>
  <text x="1020" y="510" font-family="monospace" font-size="12" fill="#475569" letter-spacing="1">YILLIK TECRÜBE</text>

  <!-- Website URL -->
  <text x="80" y="600" font-family="monospace" font-size="14" fill="#475569" letter-spacing="1">lukeristudio.com</text>
</svg>
